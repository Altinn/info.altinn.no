name: infoportal-elasticsearch-test deploy

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/infoportal-elasticsearch-test.yml
      - infrastructure/altinn-portaler-test/infoportal-elasticsearch-test/**
      - infrastructure/modules/infoportal-elasticsearch/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/infoportal-elasticsearch-test.yml
      - infrastructure/altinn-portaler-test/infoportal-elasticsearch-test/**
      - infrastructure/modules/infoportal-elasticsearch/**
  workflow_dispatch:
    inputs:
      log_level:
        required: true
        description: Terraform Log Level
        default: ERROR
        type: choice
        options:
          - INFO
          - WARN
          - ERROR

env:
  TF_STATE_NAME: infoportal-elasticsearch-test.tfstate
  WORKING_DIRECTORY: ./infrastructure/altinn-portaler-test/infoportal-elasticsearch-test
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ALTINN_PORTALER_TEST }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_ALTINN_PORTALER_TEST }}
  TF_VAR_elastic_cloud_api_key: ${{ secrets.ELASTIC_CLOUD_API_KEY }}
  TF_VAR_elasticsearch_api_key: ${{ secrets.ELASTICSEARCH_API_KEY_INFOPORTAL_TEST }}
  # TF_VAR_elasticsearch_endpoint is in terraform.tfvars
  # TF_VAR_eso_principal_id: ${{ secrets.ESO_PRINCIPAL_ID_INFOPORTAL_TEST }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Plan
    environment: test
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Hash the Elasticsearch API key
        # Terraform does not store the key, so the hash tells it when the key has changed.
        shell: bash
        run: |
          if [ -z "$TF_VAR_elasticsearch_api_key" ]; then
            echo "::error::Set the ELASTICSEARCH_API_KEY_INFOPORTAL_TEST secret."
            exit 1
          fi
          hash=$(printf '%s' "$TF_VAR_elasticsearch_api_key" | sha256sum | cut -c1-12)
          echo "TF_VAR_elasticsearch_api_key_version=$((16#$hash))" >> "$GITHUB_ENV"

      - name: Terraform Plan
        uses: Altinn/altinn-platform/actions/terraform/plan@6c06c3653ade4fb3c40d729b34b31d0dab14d0b8 # main
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          oidc_type: environment
          oidc_value: test
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tf_state_name: ${{ env.TF_STATE_NAME }}
          tf_log_level: ${{ github.event.inputs.log_level || 'ERROR' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    environment: test
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Terraform Apply
        uses: Altinn/altinn-platform/actions/terraform/apply@6c06c3653ade4fb3c40d729b34b31d0dab14d0b8 # main
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          oidc_type: environment
          oidc_value: test
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tf_state_name: ${{ env.TF_STATE_NAME }}
          tf_log_level: ${{ github.event.inputs.log_level || 'ERROR' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
