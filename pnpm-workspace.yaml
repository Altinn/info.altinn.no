packages:
  - astro-infoportal
  - cache-infoportal
  - cms-infoportal

# Each project is built separately on Cloudflare, so each needs its own lockfile
sharedWorkspaceLockfile: false

# Wait 1 day before installing newly published versions (supply-chain protection)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@digdir/designsystemet-*'
  - '@altinn/altinn-components'

allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  'fsevents': true
  'sharp': true
  'workerd': true

overrides:
  '@babel/plugin-transform-modules-systemjs': '^8.0.1'
  'devalue': '^5.9.2'
  'esbuild': '^0.28.2'
  # GHSA-g3hv-75wg-m249 (minimatch < 11.0.1): glob 13 only works with minimatch 10
  # (it matches nothing on 11), so move glob 13 users (Storybook's react-docgen plugin) to glob 14
  'glob@13': '^14.0.0'
  'picomatch': '^4.0.7'
  'postcss': '^8.5.28'
  'sharp': '^0.35.4'
  'svgo': '^4.1.0'
  'undici': '^8.12.3'
  'uuid': '^14.0.2'
  'zod': '^4.6.7'
