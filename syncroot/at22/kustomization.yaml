apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-infoportal
resources:
  - ../base
  - elasticsearch-secretstore.yaml
  - elasticsearch-secrets.yaml
  - ../base/backup

images:
  - name: umbraco
    newName: altinncr.azurecr.io/ghcr.io/altinn/umbraco
    newTag: will-be-replaced
  # Set by hand (Publish Syncroot only updates umbraco). Publish the image with this tag first.
  - name: infoportal-backup
    newName: altinncr.azurecr.io/ghcr.io/altinn/infoportal-backup
    newTag: 0.1.0

patches:
  - target:
      kind: Vault
      name: umbraco
    patch: |-
      - op: add
        path: /spec/tags/env
        value: at22
  - target:
      kind: Deployment
      name: umbraco
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__WebRouting__UmbracoApplicationUrl
          value: https://info.at22.altinn.cloud
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__Security__BackOfficeHost
          value: https://cms.at22.altinn.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ConnectionString
          value: https://infoportalmediaat224w17.blob.core.windows.net
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ContainerName
          value: umbraco
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Elasticsearch__Endpoint
          valueFrom:
            secretKeyRef:
              name: elasticsearch
              key: endpoint
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Elasticsearch__ApiKey
          valueFrom:
            secretKeyRef:
              name: elasticsearch
              key: api-key
  - target:
      kind: HTTPRoute
      name: umbraco
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - cms.at22.altinn.no
          - infoportal.at22.dis-core.altinn.cloud
  - target:
      kind: CronJob
      name: infoportal-backup
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: ENV_NAME
          value: at22
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: MEDIA_ACCOUNT
          value: infoportalmediaat224w17
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: DB_TARGET
          value: r2:infoportal-backup-at22/db
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: MEDIA_TARGET
          value: r2:infoportal-backup-at22/media
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: MEDIA_DELETED_TARGET
          value: r2:infoportal-backup-at22/media-deleted
