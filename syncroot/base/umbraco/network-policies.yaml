apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: umbraco-http-server
  labels:
    app.kubernetes.io/name: umbraco
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umbraco
  port: http
  proxyProtocol: HTTP/2
---
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: umbraco-http-route
spec:
  parentRefs:
    - name: umbraco-http-server
      kind: Server
      group: policy.linkerd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: umbraco-http-auth
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: umbraco-http-route
  requiredAuthenticationRefs:
    - name: traefik
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: traefik
spec:
  identities:
    - "altinn-traefik.traefik.serviceaccount.identity.linkerd.cluster.local"
---
# Linkerd authorizes kubelet probes automatically only when the Server has no
# HTTPRoutes. This Server has one, so the probe paths need their own route and policy.
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: umbraco-probe-route
spec:
  parentRefs:
    - name: umbraco-http-server
      kind: Server
      group: policy.linkerd.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /umbraco/api/health/live
          method: GET
        - path:
            type: Exact
            value: /umbraco/api/health/ready
          method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: umbraco-probe-auth
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: umbraco-probe-route
  requiredAuthenticationRefs:
    - name: kubelet
      kind: NetworkAuthentication
      group: policy.linkerd.io
---
# The kubelet connects from the node IP, which differs per environment, and is not
# meshed. The route above limits this to GET on the two health paths.
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: kubelet
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0
