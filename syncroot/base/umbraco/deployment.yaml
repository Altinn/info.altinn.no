apiVersion: apps/v1
kind: Deployment
metadata:
  name: umbraco
spec:
  # Umbraco does not support several instances without extra app configuration
  # (server roles, cache versioning, SignalR, shared temp files), so keep exactly one pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: umbraco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umbraco
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        linkerd.io/inject: enabled
        config.linkerd.io/skip-outbound-ports: "443,587"
    spec:
      serviceAccountName: umbraco
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: umbraco
          image: umbraco:1
          # Based on 30 days of use in prod with one pod serving all traffic (2026-08-25 to 2026-09-24):
          # CPU p95 0.10 / p99 0.25 cores, memory p95 1.0 GiB. No CPU limit, so start-up
          # (up to about 0.85 cores for 1-2 minutes) can use spare CPU on the node.
          resources:
            requests:
              cpu: 250m
              memory: 1280Mi
          env:
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: KeyVault__AkvUri
              valueFrom:
                configMapKeyRef:
                  name: umbraco-dis-vault
                  key: AkvUri
            - name: ConnectionStrings__umbracoDbDSN
              value: "Data Source=|DataDirectory|/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True"
            - name: ConnectionStrings__umbracoDbDSN_ProviderName
              value: "Microsoft.Data.Sqlite"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: infoportal
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
            - name: Cloudflare__ZoneId
              valueFrom:
                secretKeyRef:
                  name: cloudflare
                  key: Cloudflare--ZoneId
            - name: Cloudflare__ApiToken
              valueFrom:
                secretKeyRef:
                  name: cloudflare
                  key: Cloudflare--ApiToken
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Umbraco's own health endpoints, served by the pod itself (not through Cloudflare).
          # They are authorized for the kubelet in network-policies.yaml.
          startupProbe:
            httpGet:
              path: /umbraco/api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /umbraco/api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /umbraco/api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Local cache only (TEMP, NuCache, indexes). Content is in Azure SQL and media in Azure Blob.
            - name: umbraco-data-cache
              mountPath: /app/umbraco/Data
            - name: umbraco-logs
              mountPath: /app/umbraco/Logs
      volumes:
        - name: umbraco-data-cache
          emptyDir: {}
        - name: umbraco-logs
          emptyDir: {}
