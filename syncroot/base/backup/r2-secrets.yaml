# Put the values in Key Vault by hand, not with Terraform: plan files would contain them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: umbraco-secret-store
    kind: SecretStore
  target:
    name: r2-backup
    creationPolicy: Owner
  data:
    - secretKey: RCLONE_CONFIG_R2_ACCESS_KEY_ID
      remoteRef:
        key: R2Backup--AccessKeyId
    - secretKey: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
      remoteRef:
        key: R2Backup--SecretAccessKey
    - secretKey: RCLONE_CONFIG_R2_ENDPOINT
      remoteRef:
        key: R2Backup--Endpoint
