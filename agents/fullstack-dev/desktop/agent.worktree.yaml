apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: info-fullstack-dev-worktree

# Your own checkout of info.altinn.no, the one this file is in, in place of a fresh clone. The agent works on it as it
# is, on its branch.
spec:
  sandbox:
    mounts:
      - type: bind
        source: ../../..
        target: /home/agent/code/info.altinn.no
        readOnly: false
  instructions:
    - source: ../instructions.md
    - source: environment.md
    - source: ../improving.md
    - source: ../worktree.md
