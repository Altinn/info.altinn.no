# The full-stack developer agent for info.altinn.no: the Astro frontend, the Cloudflare Workers and the Umbraco CMS.
# ../README.md describes the agent, its stages and its variants.
apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: info-fullstack-dev
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/altinn/info.altinn.no/fullstack-dev-minimal:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
      # For nested agents, to try changes to this definition. A host that cannot provide them starts the agent without.
      nestedSandboxes: preferred
    initSystem: image
  instructions:
    - source: ../instructions.md
    - source: environment.md
    - source: ../improving.md
  skills:
    - source: ../skills/pr-evidence
    - source: ../skills/local-umbraco
    # The image adds the recording skill.
  harnesses:
    - type: claudeCode
      default: true
      # Whichever login you stored, whatever its name. Name one in your variant, such as `login: work`, to keep the
      # agent on it.
      login: any
    # Started without Codex when the host has no Codex login. `agentctl codex login` adds it on the next reconcile.
    - type: codex
      login: any
      optional: true
  # GITHUB_TOKEN and Git's name and email, from `agentctl github login default`, to push branches and open pull requests.
  accounts:
    - type: github
      login: default
  access:
    - type: ssh
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
